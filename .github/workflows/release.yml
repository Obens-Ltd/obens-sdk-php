name: release

# Push a tag matching composer.json's version (e.g. v0.1.3) to create a GitHub release. Packagist picks the tag up
# from the repository; until it is registered there, install from the git tag with a "vcs" repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, json
      - name: Check tag matches package version
        run: |
          version=$(php -r 'echo json_decode(file_get_contents("composer.json"), true)["version"];')
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version $version"; exit 1
          fi
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
